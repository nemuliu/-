<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3役カウンター</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 40px 10px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 400px;
        }

        .counter-unit {
            text-align: center;
            width: 100px;
        }

        .count-display {
            font-size: 40px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .btn {
            width: 100px;
            height: 80px;
            font-size: 14px;
            border-radius: 15px;
            border: none;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px #333;
            cursor: pointer;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px #333;
        }

        /* 色設定 */
        .watermelon { background-color: #2ed573; }
        .CZ { background-color: #ffa502; }
        .direct { background-color: #FF00FF; }
        .pullback { background-color: #A102FD; }

        /* ★ここがポイント：カウンターと下のボタンの間隔 */
        .reset-area {
            margin-top: 60px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .mode-btn {
            width: 240px;
            padding: 15px;
            border-radius: 10px;
            border: none;
            color: white;
            font-weight: bold;
            background: #555;
        }

        .control-buttons {
            display: flex;
            gap: 15px;
        }

        .sana-reset-btn, .reset-btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .sana-reset-btn { background: #008b8b; }
        .reset-btn { background: #b33939; }
    </style>
</head>
<body>

    <div class="container">
        <div class="counter-unit"><div class="count-display" id="display1">0</div><button class="btn watermelon" onclick="add(1)">スイカ</button></div>
        <div class="counter-unit"><div class="count-display" id="display2">0</div><button class="btn CZ" onclick="add(2)">CZ</button></div>
        <div class="counter-unit"><div class="count-display" id="display3">0</div><button class="btn direct" onclick="add(3)">AT直撃</button></div>
        <div class="counter-unit"><div class="count-display" id="display4">0</div><button class="btn watermelon" onclick="add(4)">さなスイカ</button></div>
        <div class="counter-unit"><div class="count-display" id="display5">0</div><button class="btn CZ" onclick="add(5)">さなCZ</button></div>
        <div class="counter-unit"><div class="count-display" id="display6">0</div><button class="btn pullback" onclick="add(6)">引き戻し</button></div>
    </div>

    <div class="reset-area">
        <button id="mode-btn" class="mode-btn" onclick="toggleMode()">
            現在のモード：増やす (＋)
        </button>
        
        <div class="control-buttons">
            <button class="sana-reset-btn" onclick="resetsana()">AT当選</button>
            <button class="reset-btn" onclick="resetAll()">全リセット</button>
        </div>
    </div>

    <script>
        // 重複を削除して整理
        let counts = JSON.parse(localStorage.getItem('slotCounts')) || [0, 0, 0, 0, 0, 0, 0];
        let isMinusMode = false;

        function updateDisplay() {
            for (let i = 1; i <= 6; i++) {
                const el = document.getElementById('display' + i);
                if (el) el.innerText = counts[i];
            }
            localStorage.setItem('slotCounts', JSON.stringify(counts));
        }

        function toggleMode() {
            isMinusMode = !isMinusMode;
            const btn = document.getElementById('mode-btn');
            if (isMinusMode) {
                btn.innerText = "現在のモード：減らす (－)";
                btn.style.background = "#d32f2f";
            } else {
                btn.innerText = "現在のモード：増やす (＋)";
                btn.style.background = "#555";
            }
        }

        function add(num) {
            if (isMinusMode) {
                if (counts[num] > 0) counts[num]--;
            } else {
                counts[num]++;
            }
            updateDisplay();
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function resetAll() {
            if (confirm('すべてリセットしますか？')) {
                counts = [0, 0, 0, 0, 0, 0, 0];
                updateDisplay();
            }
        }

        function resetsana() {
            const result = confirm('さなモードでしたか？');
            if (result) {
                counts[4] = 0; counts[5] = 0;
            } else {
                counts[1] += counts[4];
                counts[2] += counts[5];
                counts[4] = 0; counts[5] = 0;
            }
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
